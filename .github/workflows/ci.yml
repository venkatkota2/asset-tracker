name: Test Python engine
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]' -c requirements.lock
      - run: python -m pytest -q
      - run: node --check web/app.js
      - run: python -m indexlens.cli build --provider demo --output /tmp/demo-report.json

