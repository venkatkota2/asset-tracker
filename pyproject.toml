[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "indexlens"
version = "0.1.0"
description = "Sparse benchmark replication with honest out-of-sample evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=2.1,<3", "pandas>=2.2,<3", "scipy>=1.14,<2",
  "httpx>=0.28,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
indexlens = "indexlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

